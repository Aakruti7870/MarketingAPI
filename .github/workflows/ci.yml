name: Production Readiness

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          REACT_APP_BACKEND_URL: ""

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Compile and import Cloud Run app
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: marketingapi_ci
          JWT_SECRET: ci-only-secret-that-is-long-enough
          SEED_DEMO_DATA: "false"
          ENABLE_SIMULATION: "false"
          CRON_SECRET: ci-cron-secret
        run: |
          python -m compileall -q backend
          PYTHONPATH=backend python -c "import production; assert production.app"

  e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - name: Start production API
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: marketingapi_e2e
          JWT_SECRET: e2e-only-secret-that-must-never-be-used-in-production
          SEED_DEMO_DATA: "false"
          ENABLE_SIMULATION: "true"
          ENABLE_IN_PROCESS_AUTOPILOT: "false"
          META_WEBHOOK_VERIFY_TOKEN: e2e-meta-verify
          CRON_SECRET: e2e-cron-secret
          APP_ENV: test
        run: |
          PYTHONPATH=backend uvicorn production:app --host 127.0.0.1 --port 8000 > /tmp/marketingapi.log 2>&1 &
          echo $! > /tmp/marketingapi.pid
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/marketingapi.log
          exit 1
      - name: Run HTTP E2E suite
        env:
          TEST_BACKEND_URL: http://127.0.0.1:8000
        run: pytest -q backend/tests/test_e2e.py
      - name: Show API log
        if: always()
        run: cat /tmp/marketingapi.log || true

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t marketingapi:ci .

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Validate Firebase and Cloud Build config
        run: |
          python -m json.tool firebase.json >/dev/null
          python - <<'PY'
          import pathlib, yaml
          data = yaml.safe_load(pathlib.Path('cloudbuild.yaml').read_text())
          assert isinstance(data.get('steps'), list) and len(data['steps']) >= 6
          assert any(step.get('id') == 'deploy-cloud-run' for step in data['steps'])
          assert any(step.get('id') == 'deploy-firebase-hosting' for step in data['steps'])
          PY
