name: Lumina360 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumina360-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify build output
        run: test -f dist/server.cjs && test -f dist/index.html

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: lumina360-production-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  healthcheck:
    name: Production server smoke test
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Start server
        env:
          NODE_ENV: production
          PORT: 3000
        run: |
          nohup node dist/server.cjs > /tmp/lumina360-server.log 2>&1 &
          echo $! > /tmp/lumina360-server.pid

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lumina360-server.log || true
          exit 1

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/lumina360-server.pid ]; then
            kill "$(cat /tmp/lumina360-server.pid)" 2>/dev/null || true
          fi

# CI trigger: validate the current main branch after authentication hardening.
