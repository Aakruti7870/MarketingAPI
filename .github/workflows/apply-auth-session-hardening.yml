name: Apply Auth Session Hardening

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: hashFiles('AUTH_SESSION_HARDENING_REQUEST') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply idempotent auth session patch
        run: node scripts/harden-auth-session.mjs

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts AUTH_SESSION_HARDENING_REQUEST scripts/harden-auth-session.mjs
          if git diff --cached --quiet; then
            echo "No auth session changes required."
            exit 0
          fi
          git commit -m "Harden server-side admin sessions"
          git push origin HEAD:main
