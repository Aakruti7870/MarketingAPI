name: Apply Admin API Authorization

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enforce:
    if: hashFiles('scripts/enforce-admin-api-auth.py') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply authorization guard
        run: python3 scripts/enforce-admin-api-auth.py

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'app.get("/api/admin/keys", requireAdminSession,' server.ts
          grep -q 'app.post("/api/admin/keys/save", requireAdminSession,' server.ts
          grep -q 'app.post("/api/admin/keys/verify", requireAdminSession,' server.ts
          grep -q 'app.post("/api/admin/keys/verify-all", requireAdminSession,' server.ts
          grep -q 'app.delete("/api/admin/keys/clear", requireAdminSession,' server.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts scripts/enforce-admin-api-auth.py .github/workflows/enforce-admin-api-auth.yml
          git rm -f scripts/enforce-admin-api-auth.py .github/workflows/enforce-admin-api-auth.yml
          git commit -m 'Enforce admin API session authorization'
          git push origin HEAD:main
