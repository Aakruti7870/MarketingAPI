name: Lumina360 Auth Hardening

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate authentication hardening
        shell: bash
        run: |
          set -euo pipefail

          test -f src/context/AuthContext.jsx
          test -f src/pages/AuthPages.jsx
          test -f server.ts
          test -f .env.example

          # Browser authentication must use the server endpoint rather than
          # shipping administrator credentials or a privileged default user.
          grep -q '/api/auth/admin-login' src/context/AuthContext.jsx
          grep -q 'const context = useContext(AuthContext)' src/context/AuthContext.jsx
          grep -q 'if (!context) throw new Error' src/context/AuthContext.jsx
          grep -q 'scryptSync' server.ts
          grep -q 'timingSafeEqual' server.ts
          grep -q 'createHmac' server.ts
          grep -q 'LUMINA_ADMIN_EMAIL=' .env.example
          grep -q 'LUMINA_ADMIN_PASSWORD_HASH=' .env.example
          grep -q 'LUMINA_ADMIN_PASSWORD_SALT=' .env.example
          grep -q 'LUMINA_AUTH_SECRET=' .env.example

          # Fail if known legacy client-side admin credential shortcuts remain.
          if grep -RInE 'ADMIN_CREDENTIALS|1-Click Sign In as Admin|admin@lumina360\.ai|password123|Everything Free \(∞\)' src server.ts --exclude-dir=node_modules; then
            echo 'Legacy client-side admin credential shortcut detected.'
            exit 1
          fi

          # The example environment file may contain empty placeholders, but
          # must never contain a real credential value for the hardened fields.
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('.env.example').read_text(encoding='utf-8')
          for key in ('LUMINA_ADMIN_EMAIL', 'LUMINA_ADMIN_PASSWORD_HASH', 'LUMINA_ADMIN_PASSWORD_SALT', 'LUMINA_AUTH_SECRET'):
              match = re.search(rf'^{re.escape(key)}=(.*)$', text, re.MULTILINE)
              if not match:
                  raise SystemExit(f'Missing {key}')
              if match.group(1).strip():
                  raise SystemExit(f'{key} must remain empty in .env.example')
          print('Authentication hardening validation passed.')

      - name: Report
        run: echo 'Server-side authentication hardening is present and no legacy browser credential shortcuts were detected.'
