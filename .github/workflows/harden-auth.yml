name: Lumina360 Auth Hardening

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce sensitive admin API authorization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('server.ts')
          source = path.read_text(encoding='utf-8')
          routes = [
              ('app.get("/api/admin/keys",', 'app.get("/api/admin/keys", requireAdminSession,'),
              ('app.post("/api/admin/keys/save",', 'app.post("/api/admin/keys/save", requireAdminSession,'),
              ('app.post("/api/admin/keys/verify",', 'app.post("/api/admin/keys/verify", requireAdminSession,'),
              ('app.post("/api/admin/keys/verify-all",', 'app.post("/api/admin/keys/verify-all", requireAdminSession,'),
              ('app.delete("/api/admin/keys/clear",', 'app.delete("/api/admin/keys/clear", requireAdminSession,'),
          ]
          changed = False
          for original, protected in routes:
              malformed = original[:-1] + ' requireAdminSession,'
              if malformed in source:
                  source = source.replace(malformed, protected, 1)
                  changed = True
              elif protected not in source:
                  if original not in source:
                      raise SystemExit(f'Expected sensitive admin route not found: {original}')
                  source = source.replace(original, protected, 1)
                  changed = True
          path.write_text(source, encoding='utf-8')
          print('Admin API authorization:', 'updated' if changed else 'already enforced')
          PY

      - name: Commit authorization enforcement
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No authorization migration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git commit -m 'Fix admin API session authorization syntax'
          git push origin HEAD:main

      - name: Validate authentication hardening
        shell: bash
        run: |
          set -euo pipefail
          test -f src/context/AuthContext.jsx
          test -f src/pages/AuthPages.jsx
          test -f server.ts
          test -f .env.example
          grep -q '/api/auth/admin-login' src/context/AuthContext.jsx
          grep -q 'const context = useContext(AuthContext)' src/context/AuthContext.jsx
          grep -q 'if (!context) throw new Error' src/context/AuthContext.jsx
          grep -q 'scryptSync' server.ts
          grep -q 'timingSafeEqual' server.ts
          grep -q 'createHmac' server.ts
          grep -q 'SESSION_TTL_MS' server.ts
          grep -q 'function verifySession' server.ts
          grep -q '/api/auth/session' server.ts
          grep -q '/api/auth/logout' server.ts
          grep -q 'app.get("/api/admin/keys", requireAdminSession,' server.ts
          grep -q 'app.post("/api/admin/keys/save", requireAdminSession,' server.ts
          grep -q 'app.post("/api/admin/keys/verify", requireAdminSession,' server.ts
          grep -q 'app.post("/api/admin/keys/verify-all", requireAdminSession,' server.ts
          grep -q 'app.delete("/api/admin/keys/clear", requireAdminSession,' server.ts
          grep -q 'LUMINA_ADMIN_EMAIL=' .env.example
          grep -q 'LUMINA_ADMIN_PASSWORD_HASH=' .env.example
          grep -q 'LUMINA_ADMIN_PASSWORD_SALT=' .env.example
          grep -q 'LUMINA_AUTH_SECRET=' .env.example
          if grep -RInE 'ADMIN_CREDENTIALS|1-Click Sign In as Admin|admin@lumina360\.ai|password123' src server.ts --exclude-dir=node_modules; then
            echo 'Legacy client-side admin credential shortcut detected.'
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('.env.example').read_text(encoding='utf-8')
          for key in ('LUMINA_ADMIN_EMAIL', 'LUMINA_ADMIN_PASSWORD_HASH', 'LUMINA_ADMIN_PASSWORD_SALT', 'LUMINA_AUTH_SECRET'):
              match = re.search(rf'^{re.escape(key)}=(.*)$', text, re.MULTILINE)
              if not match or match.group(1).strip():
                  raise SystemExit(f'{key} must be present and empty in .env.example')
          print('Authentication and admin API authorization validation passed.')
          PY

      - name: Report
        run: echo 'Server-side sessions and sensitive admin API authorization are enforced; no legacy browser credential shortcuts were detected.'
