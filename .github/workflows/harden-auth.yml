name: Lumina360 Auth Hardening
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden authentication and production configuration
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          auth = Path('src/pages/AuthPages.jsx')
          auth.write_text(r'''import React, { useState } from 'react';
          import { Link, useNavigate } from 'react-router-dom';
          import { PublicNavbar, PublicFooter } from '../components/PublicNav';
          import { ArrowRight, Bot, Eye, EyeOff, Lock, Mail, ShieldCheck } from 'lucide-react';
          import { useAuth } from '../context/AuthContext';

          export function LoginPage() {
            const navigate = useNavigate();
            const { login } = useAuth();
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const handleLogin = async (e) => {
              e.preventDefault(); setLoading(true); setError('');
              const result = await login(email, password);
              if (result.success) navigate('/dashboard'); else setError(result.message || 'Unable to sign in.');
              setLoading(false);
            };
            return <div className="min-h-screen bg-gradient-to-br from-slate-50 via-indigo-50/40 to-sky-50/50 text-slate-900 flex flex-col"><PublicNavbar /><main className="flex-1 flex items-center justify-center px-4 py-12"><div className="w-full max-w-lg"><div className="bg-white/90 backdrop-blur-xl border border-white rounded-3xl p-8 sm:p-10 shadow-xl"><div className="text-center mb-8"><div className="inline-flex w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-600 to-blue-600 items-center justify-center text-white shadow-lg mb-3"><Bot className="w-6 h-6" /></div><h1 className="text-3xl font-black">Welcome Back</h1><p className="text-sm text-slate-500 mt-2">Secure access to the Lumina360 control room.</p></div><div className="mb-6 p-4 rounded-2xl bg-indigo-50 border border-indigo-100"><div className="flex items-center gap-2 text-sm font-bold text-indigo-950"><ShieldCheck className="w-4 h-4 text-indigo-600" />Super Admin access</div><p className="text-xs text-indigo-800/80 mt-1">Administrator credentials are never embedded in the browser. They are configured on the server.</p></div>{error && <div className="mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm">{error}</div>}<form onSubmit={handleLogin} className="space-y-4"><div><label className="block text-xs font-bold text-slate-700 mb-1.5">Work Email</label><div className="relative"><Mail className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" /><input value={email} onChange={(e) => setEmail(e.target.value)} type="email" required autoComplete="username" placeholder="admin@business.com" className="w-full pl-10 pr-4 py-3 rounded-2xl border border-slate-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/30" /></div></div><div><label className="block text-xs font-bold text-slate-700 mb-1.5">Password</label><div className="relative"><Lock className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" /><input value={password} onChange={(e) => setPassword(e.target.value)} type={showPassword ? 'text' : 'password'} required autoComplete="current-password" placeholder="Enter password" className="w-full pl-10 pr-11 py-3 rounded-2xl border border-slate-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/30" /><button type="button" onClick={() => setShowPassword((v) => !v)} className="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400" aria-label="Toggle password visibility">{showPassword ? <EyeOff className="w-4 h-4" /> : <Eye className="w-4 h-4" />}</button></div></div><button disabled={loading} className="w-full py-3 rounded-2xl bg-gradient-to-r from-indigo-600 to-blue-600 text-white font-black text-sm shadow-lg disabled:opacity-50 flex items-center justify-center gap-2">{loading ? 'Signing in…' : <>Enter Control Room <ArrowRight className="w-4 h-4" /></>}</button></form><div className="mt-6 text-center text-xs text-slate-600">Need a workspace? <Link to="/register" className="font-bold text-indigo-600 underline">Create one</Link></div><div className="mt-6 pt-5 border-t border-slate-100 flex items-center justify-center gap-2 text-[11px] text-slate-500"><ShieldCheck className="w-4 h-4 text-emerald-600" />Server-side credential verification enabled</div></div></div></main><PublicFooter /></div>;
          }

          export function RegisterPage() {
            const navigate = useNavigate();
            const [form, setForm] = useState({ businessName: '', fullName: '', email: '', phone: '', password: '' });
            const [loading, setLoading] = useState(false); const [message, setMessage] = useState('');
            const update = (key, value) => setForm((current) => ({ ...current, [key]: value }));
            const submit = (e) => { e.preventDefault(); setLoading(true); setTimeout(() => { setLoading(false); setMessage('Workspace registration is not enabled because durable account storage is not configured. No account was created.'); }, 300); };
            return <div className="min-h-screen bg-gradient-to-br from-slate-50 via-indigo-50/40 to-sky-50/50 text-slate-900 flex flex-col"><PublicNavbar /><main className="flex-1 flex items-center justify-center px-4 py-12"><div className="w-full max-w-xl bg-white/90 border border-white rounded-3xl p-8 sm:p-10 shadow-xl"><h1 className="text-3xl font-black">Create workspace</h1><p className="text-sm text-slate-500 mt-2 mb-7">Workspace signup will be enabled after durable account storage is connected.</p>{message && <div className="mb-5 p-3 rounded-xl bg-amber-50 border border-amber-200 text-amber-800 text-sm">{message}</div>}<form onSubmit={submit} className="grid gap-4"><input required value={form.businessName} onChange={(e) => update('businessName', e.target.value)} placeholder="Business name" className="w-full px-4 py-3 rounded-2xl border border-slate-200" /><input required value={form.fullName} onChange={(e) => update('fullName', e.target.value)} placeholder="Full name" className="w-full px-4 py-3 rounded-2xl border border-slate-200" /><input required type="email" value={form.email} onChange={(e) => update('email', e.target.value)} placeholder="Work email" className="w-full px-4 py-3 rounded-2xl border border-slate-200" /><input value={form.phone} onChange={(e) => update('phone', e.target.value)} placeholder="Phone" className="w-full px-4 py-3 rounded-2xl border border-slate-200" /><input required type="password" autoComplete="new-password" value={form.password} onChange={(e) => update('password', e.target.value)} placeholder="Password" className="w-full px-4 py-3 rounded-2xl border border-slate-200" /><button disabled={loading} className="py-3 rounded-2xl bg-indigo-600 text-white font-bold disabled:opacity-50">{loading ? 'Checking…' : 'Request workspace'}</button></form><div className="mt-6 text-center text-xs text-slate-600">Already have access? <button onClick={() => navigate('/login')} className="font-bold text-indigo-600 underline">Sign in</button></div></div></main><PublicFooter /></div>;
          }
          ''', encoding='utf-8')

          server = Path('server.ts')
          s = server.read_text(encoding='utf-8')
          if 'scryptSync' not in s:
            s = s.replace('import multer from "multer";\n', 'import multer from "multer";\nimport { createHmac, scryptSync, timingSafeEqual } from "crypto";\n')
          s = s.replace('const PORT = 3000;', 'const PORT = Number(process.env.PORT || 3000);')
          config = '''\nconst ADMIN_EMAIL = (process.env.LUMINA_ADMIN_EMAIL || "").trim().toLowerCase();\nconst ADMIN_PASSWORD_HASH = process.env.LUMINA_ADMIN_PASSWORD_HASH || "";\nconst ADMIN_PASSWORD_SALT = process.env.LUMINA_ADMIN_PASSWORD_SALT || "";\nconst AUTH_SECRET = process.env.LUMINA_AUTH_SECRET || "";\nfunction verifyAdminPassword(password: string): boolean {\n  if (!ADMIN_EMAIL || !ADMIN_PASSWORD_HASH || !ADMIN_PASSWORD_SALT || !AUTH_SECRET) return false;\n  try { const derived = scryptSync(password, ADMIN_PASSWORD_SALT, 64).toString("hex"); return timingSafeEqual(Buffer.from(derived, "hex"), Buffer.from(ADMIN_PASSWORD_HASH, "hex")); } catch { return false; }\n}\nfunction issueSession(email: string): string {\n  const payload = Buffer.from(JSON.stringify({ email, role: "SUPER_ADMIN", iat: Date.now() })).toString("base64url");\n  const signature = createHmac("sha256", AUTH_SECRET).update(payload).digest("base64url");\n  return `${payload}.${signature}`;\n}\n'''
          if 'const ADMIN_EMAIL =' not in s:
            s = s.replace('app.use(express.urlencoded({ extended: true }));\n', 'app.use(express.urlencoded({ extended: true }));\n' + config)
          pattern = r'// Admin authentication endpoint\napp\.post\("/api/auth/admin-login",[\s\S]*?\n\}\);\n\n// AI Studio Playground Multi-Model Generation Endpoint'
          replacement = '''// Server-side administrator authentication. No credentials are shipped to the browser.\napp.post("/api/auth/admin-login", (req: Request, res: Response) => {\n  const cleanEmail = String(req.body?.email || "").trim().toLowerCase();\n  const password = String(req.body?.password || "");\n  if (!verifyAdminPassword(password) || cleanEmail !== ADMIN_EMAIL) return res.status(401).json({ success: false, message: "Invalid email or password." });\n  return res.json({ success: true, sessionToken: issueSession(cleanEmail), user: { email: cleanEmail, name: "Super Admin", role: "SUPER_ADMIN", isEverythingFree: true, credits: 999999, plan: "Super Admin Lifetime" }, message: "Authenticated." });\n});\n\n// AI Studio Playground Multi-Model Generation Endpoint'''
          s, count = re.subn(pattern, replacement, s)
          if count != 1: raise SystemExit(f'Expected one admin auth block, found {count}')
          s = re.sub(r'\n\s*"[^"]+": \{\n\s*credits: 999999,\n\s*plan: "Super Admin Lifetime \(Everything Free\)",\n\s*plan_status: "active",\n\s*total_spent_inr: 0,\n\s*\},\n', '\n', s, count=1)
          s = re.sub(r'user_id === "[^"]+@[^\"]+" \|\| user_id === "admin"', 'user_id === "admin"', s)
          server.write_text(s, encoding='utf-8')

          env = Path('.env.example')
          e = env.read_text(encoding='utf-8') if env.exists() else ''
          if 'LUMINA_ADMIN_PASSWORD_HASH=' not in e:
            env.write_text(e.rstrip() + '\n\n# Server-side administrator authentication (never commit real values)\nLUMINA_ADMIN_EMAIL=\nLUMINA_ADMIN_PASSWORD_HASH=\nLUMINA_ADMIN_PASSWORD_SALT=\nLUMINA_AUTH_SECRET=\n', encoding='utf-8')
          PY
          if grep -RInE 'ADMIN_CREDENTIALS|1-Click Sign In as Admin|Everything Free \(∞\)' src server.ts --exclude-dir=node_modules; then echo 'Legacy client-side admin access remains.'; exit 1; fi
      - name: Commit hardened files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/context/AuthContext.jsx src/pages/AuthPages.jsx server.ts .env.example
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "security: harden server-side authentication"
          git push
