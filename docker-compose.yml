services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - marketingapi_mongo:/data/db

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8080:8080"
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: marketingapi
      JWT_SECRET: ${JWT_SECRET}
      SEED_DEMO_DATA: "false"
      ALLOWED_ORIGINS: http://localhost:8080

volumes:
  marketingapi_mongo:
