services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - marketingapi_mongo:/data/db

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8000:8080"
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: marketingapi
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-local-meta-verify}
      CRON_SECRET: ${CRON_SECRET:-local-cron-secret}
      SEED_DEMO_DATA: "false"
      ENABLE_SIMULATION: "true"
      ENABLE_IN_PROCESS_AUTOPILOT: "true"
      ALLOWED_ORIGINS: http://localhost:3000

  frontend:
    image: node:20-alpine
    working_dir: /app
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - marketingapi_node_modules:/app/node_modules
    environment:
      REACT_APP_BACKEND_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    command: sh -c "npm install --no-audit --no-fund && npm start"

volumes:
  marketingapi_mongo:
  marketingapi_node_modules:
