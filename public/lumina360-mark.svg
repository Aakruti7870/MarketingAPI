<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="luminaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4D7CFF" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0.2" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer 360 Luminous Orbit Track -->
  <circle cx="50" cy="50" r="42" stroke="url(#luminaGradient)" stroke-width="2" stroke-dasharray="8 4" stroke-opacity="0.4" />
  
  <!-- Subtle Outer Accent Ring -->
  <circle cx="50" cy="50" r="36" stroke="#0052FF" stroke-width="1.5" stroke-opacity="0.15" />

  <!-- 4 Dynamic 360-Degree Radial Blades / Luminous Aperture -->
  <!-- Top-Right Blade -->
  <path d="M 50 14 C 68 14 82 28 84 46 C 72 44 60 38 52 28 Z" fill="url(#luminaGradient)" opacity="0.95" />
  
  <!-- Bottom-Right Blade -->
  <path d="M 86 50 C 86 68 72 82 54 84 C 56 72 62 60 72 52 Z" fill="url(#luminaGradient)" opacity="0.9" />
  
  <!-- Bottom-Left Blade -->
  <path d="M 50 86 C 32 86 18 72 16 54 C 28 56 40 62 48 72 Z" fill="url(#luminaGradient)" opacity="0.95" />
  
  <!-- Top-Left Blade -->
  <path d="M 14 50 C 14 32 28 18 46 16 C 44 28 38 40 28 48 Z" fill="url(#luminaGradient)" opacity="0.9" />

  <!-- Inner High-Tech Aperture Prism -->
  <polygon points="50,26 74,50 50,74 26,50" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
  <polygon points="50,30 70,50 50,70 30,50" fill="url(#glowGradient)" />

  <!-- Central Core Light Node -->
  <circle cx="50" cy="50" r="7.5" fill="#FFFFFF" filter="url(#subtleGlow)" />
  <circle cx="50" cy="50" r="5" fill="#0052FF" />
  <circle cx="50" cy="50" r="2" fill="#FFFFFF" />

  <!-- 4 Orbital 360-Degree Satellite Nodes -->
  <circle cx="50" cy="8" r="3.5" fill="#0052FF" />
  <circle cx="92" cy="50" r="3.5" fill="#4D7CFF" />
  <circle cx="50" cy="92" r="3.5" fill="#0052FF" />
  <circle cx="8" cy="50" r="3.5" fill="#4D7CFF" />
</svg>
