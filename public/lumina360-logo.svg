<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="logoLuminaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="100%" stop-color="#4D7CFF" />
    </linearGradient>
    <linearGradient id="logoInnerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#0052FF" />
    </linearGradient>
  </defs>

  <!-- Group: Logo Mark Icon (Centered at X: 40, Y: 40, Size: 60x60) -->
  <g transform="translate(10, 10)">
    <!-- 360 Orbit Track -->
    <circle cx="30" cy="30" r="28" stroke="url(#logoLuminaGrad)" stroke-width="1.5" stroke-dasharray="6 3" stroke-opacity="0.4" />
    <circle cx="30" cy="30" r="24" stroke="#0052FF" stroke-width="1" stroke-opacity="0.2" />

    <!-- 4 Radial Blades -->
    <path d="M 30 6 C 42 6 52 16 54 28 C 46 26 38 22 32 16 Z" fill="url(#logoLuminaGrad)" opacity="0.95" />
    <path d="M 54 30 C 54 42 44 52 32 54 C 34 46 38 38 44 32 Z" fill="url(#logoLuminaGrad)" opacity="0.9" />
    <path d="M 30 54 C 18 54 8 44 6 32 C 14 34 22 38 28 44 Z" fill="url(#logoLuminaGrad)" opacity="0.95" />
    <path d="M 6 30 C 6 18 16 8 28 6 C 26 14 22 22 16 28 Z" fill="url(#logoLuminaGrad)" opacity="0.9" />

    <!-- Inner Aperture Diamond -->
    <polygon points="30,14 46,30 30,46 14,30" fill="none" stroke="#FFFFFF" stroke-width="1.8" />
    <polygon points="30,17 43,30 30,43 17,30" fill="url(#logoInnerGlow)" opacity="0.4" />

    <!-- Core Node -->
    <circle cx="30" cy="30" r="4.5" fill="#FFFFFF" />
    <circle cx="30" cy="30" r="3" fill="#0052FF" />

    <!-- Satellites -->
    <circle cx="30" cy="2" r="2.5" fill="#0052FF" />
    <circle cx="58" cy="30" r="2.5" fill="#4D7CFF" />
    <circle cx="30" cy="58" r="2.5" fill="#0052FF" />
    <circle cx="2" cy="30" r="2.5" fill="#4D7CFF" />
  </g>

  <!-- Typography: LUMINA -->
  <text x="88" y="47" font-family="Inter, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="2" fill="#0F172A">
    LUMINA
  </text>

  <!-- Typography: 360 in Electric Blue Gradient -->
  <text x="212" y="47" font-family="Inter, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="1" fill="url(#logoLuminaGrad)">
    360
  </text>

  <!-- Subtitle Badge: AUTONOMOUS AI OS -->
  <rect x="88" y="55" width="138" height="15" rx="3" fill="#0052FF" fill-opacity="0.08" stroke="#0052FF" stroke-opacity="0.2" stroke-width="0.75" />
  <text x="94" y="65.5" font-family="JetBrains Mono, monospace" font-weight="700" font-size="8" letter-spacing="1.5" fill="#0052FF">
    AUTONOMOUS AI OS
  </text>
</svg>
