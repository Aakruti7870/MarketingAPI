substitutions:
  _REGION: asia-south1
  _SERVICE: marketingapi
  _AR_REPO: marketingapi
  _SCHEDULER_JOB: marketingapi-scheduler
  _PUBLIC_ORIGIN: https://gold-etechapp.com

steps:
  - id: ensure-artifact-registry
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        if ! gcloud artifacts repositories describe '${_AR_REPO}' --location '${_REGION}' >/dev/null 2>&1; then
          gcloud artifacts repositories create '${_AR_REPO}' \
            --repository-format=docker \
            --location='${_REGION}' \
            --description='MarketingAPI Cloud Run images'
        fi

  - id: backend-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID
      - .

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --cpu=1
      - --memory=1Gi
      - --concurrency=80
      - --min=0
      - --max=20
      - --set-env-vars=APP_ENV=production,DB_NAME=marketingapi,ENABLE_SIMULATION=false,ENABLE_IN_PROCESS_AUTOPILOT=false,OPENAI_MODEL=gpt-5,OPENAI_IMAGE_MODEL=gpt-image-1.5,ALLOWED_ORIGINS=${_PUBLIC_ORIGIN}
      - --set-secrets=MONGO_URL=MARKETINGAPI_MONGO_URL:latest,JWT_SECRET=MARKETINGAPI_JWT_SECRET:latest,VAULT_KEY=MARKETINGAPI_VAULT_KEY:latest,OPENAI_API_KEY=MARKETINGAPI_OPENAI_API_KEY:latest,META_WEBHOOK_VERIFY_TOKEN=MARKETINGAPI_META_WEBHOOK_VERIFY_TOKEN:latest,CRON_SECRET=MARKETINGAPI_CRON_SECRET:latest

  - id: verify-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        SERVICE_URL="$(gcloud run services describe '${_SERVICE}' --region '${_REGION}' --format='value(status.url)')"
        echo "Verifying Cloud Run: $${SERVICE_URL}"
        for attempt in $(seq 1 30); do
          if BODY="$$(curl -fsS --max-time 15 "$${SERVICE_URL}/api/health" 2>/dev/null)"; then
            echo "$$BODY"
            echo "$$BODY" | grep -q '"status":"ok"'
            echo "$$BODY" | grep -q '"database":"ok"'
            exit 0
          fi
          echo "Cloud Run health attempt $$attempt/30 not ready"
          sleep 2
        done
        echo "Cloud Run did not become healthy"
        exit 1

  - id: configure-scheduler
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    secretEnv:
      - CRON_SECRET
    args:
      - -ceu
      - |
        SERVICE_URL="$(gcloud run services describe '${_SERVICE}' --region '${_REGION}' --format='value(status.url)')"
        if gcloud scheduler jobs describe '${_SCHEDULER_JOB}' --location '${_REGION}' >/dev/null 2>&1; then
          gcloud scheduler jobs update http '${_SCHEDULER_JOB}' \
            --location '${_REGION}' \
            --schedule '*/5 * * * *' \
            --uri "$${SERVICE_URL}/api/autopilot/internal/run" \
            --http-method POST \
            --update-headers "X-Cron-Secret=$$CRON_SECRET"
        else
          gcloud scheduler jobs create http '${_SCHEDULER_JOB}' \
            --location '${_REGION}' \
            --schedule '*/5 * * * *' \
            --uri "$${SERVICE_URL}/api/autopilot/internal/run" \
            --http-method POST \
            --headers "X-Cron-Secret=$$CRON_SECRET"
        fi

  - id: frontend-install
    name: node:20-alpine
    dir: frontend
    entrypoint: npm
    args:
      - install
      - --no-audit
      - --no-fund

  - id: frontend-build
    name: node:20-alpine
    dir: frontend
    entrypoint: npm
    env:
      - REACT_APP_BACKEND_URL=
    args:
      - run
      - build

  - id: deploy-firebase-hosting
    name: us-docker.pkg.dev/firebase-cli/us/firebase
    args:
      - deploy
      - --project
      - $PROJECT_ID
      - --only
      - hosting
      - --non-interactive

  - id: verify-public-release
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        echo "Verifying public release at ${_PUBLIC_ORIGIN}"
        for attempt in $(seq 1 30); do
          if HEALTH="$$(curl -fsS --max-time 15 '${_PUBLIC_ORIGIN}/api/health' 2>/dev/null)"; then
            echo "$$HEALTH"
            echo "$$HEALTH" | grep -q '"status":"ok"'
            echo "$$HEALTH" | grep -q '"database":"ok"'
            VERSION="$$(curl -fsS --max-time 15 '${_PUBLIC_ORIGIN}/api/version')"
            echo "$$VERSION"
            echo "$$VERSION" | grep -q '"environment":"production"'
            echo "Production release verified end to end."
            exit 0
          fi
          echo "Public health attempt $$attempt/30 not ready"
          sleep 2
        done
        echo "Public Firebase -> Cloud Run release verification failed"
        exit 1

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/MARKETINGAPI_CRON_SECRET/versions/latest
      env: CRON_SECRET

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
